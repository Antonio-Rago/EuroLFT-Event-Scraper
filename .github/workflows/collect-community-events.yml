name: Prepare community event review

on:
  workflow_dispatch:
    inputs:
      open_draft_pr:
        description: 'Submit the next event for review in EuroLFT/eurolft.github.io'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: community-event-collection
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.review.outputs.count }}
      ready: ${{ steps.review.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: EuroLFT/eurolft.github.io
          ref: main
          path: .event-site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/event_collector/requirements.txt
      - name: Preserve an existing open website proposal
        id: existing
        run: python -m tools.event_collector.submit --check --github-output "$GITHUB_OUTPUT"
      - name: Prepare bounded INSPIRE website review
        id: review
        if: steps.existing.outputs.blocked != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.event_collector.automation --site .event-site --github-output "$GITHUB_OUTPUT"
      - name: Upload minimal review files
        if: steps.review.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: community-event-review
          path: |
            ${{ steps.review.outputs.package }}/changes/
            ${{ steps.review.outputs.package }}/review.md
            ${{ steps.review.outputs.package }}/manifest.json
          retention-days: 14
  publish-draft:
    needs: prepare
    if: inputs.open_draft_pr && needs.prepare.outputs.ready == 'success' && needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit website write credential
        env:
          EVENT_REVIEW_TOKEN: ${{ secrets.EVENT_REVIEW_TOKEN }}
        run: |
          test -n "$EVENT_REVIEW_TOKEN" || { echo 'Configure EVENT_REVIEW_TOKEN for website contents/PR access, or use preparation only.'; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/event_collector/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: community-event-review
          path: _event_collector/local/review-package
      - name: Submit the next event for GitHub review
        env:
          GH_TOKEN: ${{ secrets.EVENT_REVIEW_TOKEN }}
        run: python -m tools.event_collector.submit _event_collector/local/review-package
